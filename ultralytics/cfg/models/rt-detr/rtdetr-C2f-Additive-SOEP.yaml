# Combined Model: C2f-Additive Backbone + SOEP Head (P2 Injection)

# Parameters
nc: 80  # VisDrone 请改为 10
scales: 
  l: [1.00, 1.00, 1024]

# ====================================================================
# [Part 1] Backbone: C2f-Additive-CGLU (恢复高精度通道配置)
# ====================================================================
backbone:
  # [from, repeats, module, args]
  # Stem (初始下采样)
  - [-1, 1, ConvNormLayer, [32, 3, 2, None, False, 'relu']] # 0-P1/2
  - [-1, 1, ConvNormLayer, [32, 3, 1, None, False, 'relu']] # 1
  - [-1, 1, ConvNormLayer, [64, 3, 1, None, False, 'relu']] # 2
  - [-1, 1, nn.MaxPool2d, [3, 2, 1]] # 3-P2/4 (Stride=4)

  # Stage 1 (P2): SOEP 的关键输入源
  - [-1, 3, C2f_AdditiveBlock_CGLU, [64, True]] # 4 -> P2 Source (64ch)

  # Stage 2 (P3): 保持 256 通道，拒绝瓶颈
  - [-1, 1, Conv, [256, 3, 2]] # 5
  - [-1, 3, C2f_AdditiveBlock_CGLU, [256, True]] # 6 -> P3 Source (256ch)

  # Stage 3 (P4): 保持 384 通道
  - [-1, 1, Conv, [384, 3, 2]] # 7
  - [-1, 3, C2f_AdditiveBlock_CGLU, [384, True]] # 8 -> P4 Source (384ch)

  # Stage 4 (P5)
  - [-1, 1, Conv, [384, 3, 2]] # 9
  - [-1, 3, C2f_AdditiveBlock_CGLU, [384, True]] # 10 -> P5 Source (384ch)

# ====================================================================
# [Part 2] Head: SOEP (SPD P2 Injection + OmniKernel)
# ====================================================================
head:
  # --- P5 处理 ---
  - [10, 1, Conv, [256, 1, 1, None, 1, 1, False]]  # 11 input_proj.3
  - [-1, 1, AIFI, [1024, 8]] # 12
  - [-1, 1, Conv, [256, 1, 1]]  # 13 Y5

  # --- P5 -> P4 ---
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']] # 14
  - [8, 1, Conv, [256, 1, 1, None, 1, 1, False]]  # 15 input_proj.2 (Source: Layer 8)
  - [[-2, -1], 1, Concat, [1]] # 16
  - [-1, 3, RepC3, [256, 0.5]]  # 17 Y4 (P4特征)

  # --- SOEP 核心模块: P4 + P3 + P2(SPD) ---
  # 1. 准备 P4 下行特征
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']] # 18 (From Y4)
  
  # 2. 准备 P3 横向特征
  - [6, 1, Conv, [256, 1, 1, None, 1, 1, False]]  # 19 input_proj.1 (Source: Layer 6)
  
  # 3. 准备 P2 注入特征 (使用 SPDConv 无损变换)
  # 输入 Layer 4 (64ch) -> SPD -> 输出 256ch 以匹配融合层
  - [4, 1, SPDConv, [256]] # 20 (Source: Layer 4 - P2)

  # 4. 三路融合 (P4上采样, P3本体, P2变换)
  - [[18, 19, 20], 1, Concat, [1]]  # 21
  
  # 5. 全能核特征整合
  - [-1, 1, CSPOmniKernel, []] # 22
  - [-1, 3, RepC3, [256, 0.5]]  # 23 X3 (输出 P3 最终特征)

  # --- Bottom-Up (PANet) ---
  # P3 -> P4
  - [-1, 1, Conv, [256, 3, 2]]   # 24 downsample
  - [[-1, 17], 1, Concat, [1]]  # 25 cat Y4
  - [-1, 3, RepC3, [256, 0.5]]    # 26 F4

  # P4 -> P5
  - [-1, 1, Conv, [256, 3, 2]]   # 27 downsample
  - [[-1, 13], 1, Concat, [1]]  # 28 cat Y5
  - [-1, 3, RepC3, [256, 0.5]]    # 29 F5

  # --- Detect Head ---
  # 注意：这里恢复了 Hidden Dim 为 256，之前你是 128
  - [[23, 26, 29], 1, RTDETRDecoder, [nc, 256, 300, 4, 8, 3]]