# Route B experiment C: RT-DETR-r18 + P2 + DCNv4 in P4/P5 backbone stages.

nc: 10
scales:
  l: [1.00, 1.00, 1024]

backbone:
  - [-1, 1, ConvNormLayer, [32, 3, 2, None, False, 'relu']] # 0-P1/2
  - [-1, 1, ConvNormLayer, [32, 3, 1, None, False, 'relu']] # 1
  - [-1, 1, ConvNormLayer, [64, 3, 1, None, False, 'relu']] # 2
  - [-1, 1, nn.MaxPool2d, [3, 2, 1]] # 3-P2/4
  - [-1, 1, Blocks, [64, BasicBlock, 2, 2, 'relu']] # 4-P2
  - [-1, 1, Blocks, [128, BasicBlock, 2, 3, 'relu']] # 5-P3/8
  - [-1, 1, Blocks, [256, BasicBlock_DCNv4, 2, 4, 'relu']] # 6-P4/16
  - [-1, 1, Blocks, [512, BasicBlock_DCNv4, 2, 5, 'relu']] # 7-P5/32

head:
  - [-1, 1, Conv, [256, 1, 1, None, 1, 1, False]] # 8 input_proj.3
  - [-1, 1, AIFI, [1024, 8]] # 9
  - [-1, 1, Conv, [256, 1, 1]] # 10 Y5

  - [-1, 1, nn.Upsample, [None, 2, 'nearest']] # 11
  - [6, 1, Conv, [256, 1, 1, None, 1, 1, False]] # 12 input_proj.2
  - [[-2, -1], 1, Concat, [1]] # 13
  - [-1, 3, RepC3, [256, 0.5]] # 14
  - [-1, 1, Conv, [256, 1, 1]] # 15 Y4

  - [-1, 1, nn.Upsample, [None, 2, 'nearest']] # 16
  - [5, 1, Conv, [256, 1, 1, None, 1, 1, False]] # 17 input_proj.1
  - [[-2, -1], 1, Concat, [1]] # 18
  - [-1, 3, RepC3, [256, 0.5]] # 19 X3

  - [-1, 1, nn.Upsample, [None, 2, 'nearest']] # 20
  - [4, 1, Conv, [256, 1, 1, None, 1, 1, False]] # 21 input_proj.0
  - [[-2, -1], 1, Concat, [1]] # 22
  - [-1, 3, RepC3, [128, 0.5]] # 23 X2

  - [-1, 1, Conv, [256, 3, 2]] # 24
  - [[-1, 19], 1, Concat, [1]] # 25
  - [-1, 3, RepC3, [256, 0.5]] # 26 F3

  - [-1, 1, Conv, [256, 3, 2]] # 27
  - [[-1, 15], 1, Concat, [1]] # 28
  - [-1, 3, RepC3, [256, 0.5]] # 29 F4

  - [-1, 1, Conv, [256, 3, 2]] # 30
  - [[-1, 10], 1, Concat, [1]] # 31
  - [-1, 3, RepC3, [256, 0.5]] # 32 F5

  - [[23, 26, 29, 32], 1, RTDETRDecoder, [nc, 128, 300, 4, 8, 3]]
