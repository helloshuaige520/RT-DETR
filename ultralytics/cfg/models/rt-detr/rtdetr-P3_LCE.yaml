# RT-DETR-r18 + P3_LCE (SAFE VERSION)

nc: 80
scales:
  l: [1.0, 1.0, 1024]

# ---------------- Backbone ----------------
backbone:
  - [-1, 1, ConvNormLayer, [3, 32, 3, 2]]
  - [-1, 1, ConvNormLayer, [32, 32, 3, 1]]
  - [-1, 1, ConvNormLayer, [32, 64, 3, 1]]
  - [-1, 1, MaxPool2d, [3, 2, 1]]

  - [-1, 1, Blocks, [64, 64, BasicBlock, 2, 2]]
  - [-1, 1, Blocks, [64, 128, BasicBlock, 2, 3]]

  # P3 enhancement
  - [-1, 1, P3_LCE, [128]]

  - [-1, 1, Blocks, [128, 256, BasicBlock, 2, 4]]
  - [-1, 1, Blocks, [256, 512, BasicBlock, 2, 5]]

# ---------------- Neck ----------------
neck:
  - [-1, 1, Conv, [512, 256, 1, 1]]
  - [-1, 1, AIFI, [256, 1024, 8]]
  - [-1, 1, Conv, [256, 256, 1, 1]]

  - [-1, 1, Upsample, [null, 2, nearest]]
  - [6, 1, Conv, [128, 256, 1, 1]]
  - [[-2, -1], 1, Concat, [1]]
  - [-1, 3, RepC3, [512, 256, 3, 0.5]]

  - [-1, 1, Conv, [256, 256, 1, 1]]
  - [-1, 1, Upsample, [null, 2, nearest]]
  - [5, 1, Conv, [128, 256, 1, 1]]
  - [[-2, -1], 1, Concat, [1]]
  - [-1, 3, RepC3, [512, 256, 3, 0.5]]

  - [-1, 1, Conv, [256, 256, 3, 2]]
  - [[-1, 15], 1, Concat, [1]]
  - [-1, 3, RepC3, [512, 256, 3, 0.5]]

  - [-1, 1, Conv, [256, 256, 3, 2]]
  - [[-1, 10], 1, Concat, [1]]
  - [-1, 3, RepC3, [512, 256, 3, 0.5]]

# ---------------- Head ----------------
head:
  - [[19, 22, 25], 1, RTDETRDecoder, [nc, [512, 512, 512], 256, 300, 4, 8, 3]]
