  - [-1, 1, AIFI, [1024, 8]] # 12
  - [-1, 1, Conv, [256, 1, 1]] # 13-Y5

  - [-1, 1, DySample, [2, 'lp']] # 14
  - [8, 1, Conv, [256, 1, 1, None, 1, 1, False]] # 15
  - [[-2, -1], 1, Concat, [1]] # 16
  - [-1, 3, RepC3, [256, 0.5]] # 17
  - [-1, 1, Conv, [256, 1, 1]] # 18-Y4

  - [-1, 1, DySample, [2, 'lp']] # 19
  - [6, 1, Conv, [256, 1, 1, None, 1, 1, False]] # 20
  - [[-2, -1], 1, Concat, [1]] # 21
  - [-1, 3, RepC3, [256, 0.5]] # 22-X3

  - [-1, 1, DySample, [2, 'lp']] # 23
  - [4, 1, Conv, [256, 1, 1, None, 1, 1, False]] # 24
  - [[-2, -1], 1, Concat, [1]] # 25
  - [-1, 3, RepC3, [256, 0.5]] # 26-X2

  - [-1, 1, Conv, [256, 3, 2]] # 27
  - [[-1, 22], 1, Concat, [1]] # 28
  - [-1, 3, RepC3, [256, 0.5]] # 29-F3

  - [-1, 1, Conv, [256, 3, 2]] # 30
  - [[-1, 18], 1, Concat, [1]] # 31
