# RT-DETR-l-TinyHead-Pro (针对 VisDrone 深度优化版)

# Parameters
nc: 10  # VisDrone 类别数通常为 10
scales: 
  l: [1.00, 1.00, 1024]

# ====================================================================
# [改进点 1]: 建议将 Backbone 替换为你之前的 SOTA 模块
# 如果显存允许，请把下方的 ResNet 结构换成 C2f_AdditiveBlock_CGLU
# ====================================================================
backbone:
  # [from, repeats, module, args]
  - [-1, 1, ConvNormLayer, [32, 3, 2, None, False, 'relu']] # 0-P1/2
  - [-1, 1, ConvNormLayer, [32, 3, 1, None, False, 'relu']] # 1
  - [-1, 1, ConvNormLayer, [64, 3, 1, None, False, 'relu']] # 2
  - [-1, 1, nn.MaxPool2d, [3, 2, 1]] # 3-P2/4
  
  # ResNet Blocks (建议替换为 C2f-Additive-CGLU)
  - [-1, 1, Blocks, [64, BasicBlock, 2, 2, 'relu']] # 4-P2 (64ch) -> 这里的特征对小目标至关重要
  - [-1, 1, Blocks, [128, BasicBlock, 2, 3, 'relu']] # 5-P3 (128ch)
  - [-1, 1, Blocks, [256, BasicBlock, 2, 4, 'relu']] # 6-P4 (256ch)
  - [-1, 1, Blocks, [512, BasicBlock, 2, 5, 'relu']] # 7-P5 (512ch)

head:
  # =========================== Encoder 输入投影 ===========================
  - [-1, 1, Conv, [256, 1, 1, None, 1, 1, False]]  # 8 input_proj.3 (P5)
  - [-1, 1, AIFI, [1024, 8]] # 9 AIFI 处理最高层语义
  - [-1, 1, Conv, [256, 1, 1]]  # 10 Y5

  # =========================== Top-Down Path (自顶向下) ===========================
  # [改进点 2]: 使用 DySample 替换 nn.Upsample，拒绝模糊！
  - [-1, 1, DySample, [256]] # 11 (原 nn.Upsample) P5->P4
  #- [-1, 1, nn.Upsample, [None, 2, 'nearest']] # 原版备份
  
  - [6, 1, Conv, [256, 1, 1, None, 1, 1, False]]  # 12 input_proj.2 (P4)
  - [[-2, -1], 1, Concat, [1]] # 13
  - [-1, 3, RepC3, [256, 0.5]]  # 14 fpn_blocks.0
  - [-1, 1, Conv, [256, 1, 1]]   # 15 Y4

  # P4 -> P3 上采样
  - [-1, 1, DySample, [256]] # 16 (原 nn.Upsample) P4->P3
  
  - [5, 1, Conv, [256, 1, 1, None, 1, 1, False]]  # 17 input_proj.1 (P3)
  - [[-2, -1], 1, Concat, [1]]  # 18
  - [-1, 3, RepC3, [256, 0.5]]    # 19 X3 (P3特征)

  # P3 -> P2 上采样 (新增的小目标通路)
  - [-1, 1, DySample, [256]] # 20 (原 nn.Upsample) P3->P2
  
  - [4, 1, Conv, [256, 1, 1, None, 1, 1, False]]  # 21 input_proj.0 (P2 from Backbone)
  - [[-2, -1], 1, Concat, [1]]  # 22
  - [-1, 3, RepC3, [128, 0.5]]    # 23 X2 (P2特征, 极小目标专用)

  # =========================== Bottom-Up Path (自底向上) ===========================
  # [改进点 3]: 使用 SPD-Conv 进行下采样，保留细粒度信息
  # P2 -> P3
  - [-1, 1, SPDConv, [256]]   # 24 (原 Conv 3x3 s2)
  #- [-1, 1, Conv, [256, 3, 2]] # 原版备份
  
  - [[-1, 19], 1, Concat, [1]]  # 25 Cat P3
  - [-1, 3, RepC3, [256, 0.5]]    # 26 F3

  # P3 -> P4
  - [-1, 1, SPDConv, [256]]   # 27 (原 Conv 3x3 s2)
  - [[-1, 15], 1, Concat, [1]]  # 28 Cat P4
  - [-1, 3, RepC3, [256, 0.5]]    # 29 F4

  # P4 -> P5
  - [-1, 1, Conv, [256, 3, 2]]   # 30 这里是大目标，可以用普通 Conv 省显存，或者也换 SPD
  - [[-1, 10], 1, Concat, [1]]  # 31 Cat P5
  - [-1, 3, RepC3, [256, 0.5]]    # 32 F5

  # =========================== Head ===========================
  # 4个输出头: P2(23), P3(26), P4(29), P5(32)
  - [[23, 26, 29, 32], 1, RTDETRDecoder, [nc, 128, 300, 4, 8, 3]]