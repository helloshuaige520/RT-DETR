# Ultralytics YOLO 🚀, AGPL-3.0 license
# RT-DETR for aerial small object detection:
# DSDC backbone + SPAFM neck + SAIW regression loss

# Parameters
nc: 10
scales:
  l: [1.00, 1.00, 1024]

loss:
  use_vfl: false
  use_svfl: false
  use_emasvfl: true
  svfl_alpha: 0.6
  svfl_gamma: 1.5
  saiw_loss: true
  saiw_tau: 0.003
  saiw_k: 3.0
  saiw_beta: 0.5
  saiw_inner_min: 0.55
  saiw_inner_max: 0.85
  nwd_constant: 10.0
  matcher_cost_gain:
    class: 2.0
    bbox: 5.0
    giou: 2.0

backbone:
  # [from, repeats, module, args]
  - [-1, 1, ConvNormLayer, [32, 3, 2, None, False, 'relu']] # 0-P1/2
  - [-1, 1, ConvNormLayer, [32, 3, 1, None, False, 'relu']] # 1
  - [-1, 1, ConvNormLayer, [64, 3, 1, None, False, 'relu']] # 2
  - [-1, 1, nn.MaxPool2d, [3, 2, 1]] # 3-P2/4

  - [-1, 3, C2f_DSDC, [64, True]] # 4-P2
  - [-1, 1, Conv, [128, 3, 2]] # 5-P3/8
  - [-1, 3, C2f_DSDC, [128, True]] # 6-P3
  - [-1, 1, Conv, [256, 3, 2]] # 7-P4/16
  - [-1, 3, C2f_DSDC_DCNv4, [256, True]] # 8-P4
  - [-1, 1, Conv, [512, 3, 2]] # 9-P5/32
  - [-1, 3, C2f_DSDC_DCNv4, [512, True]] # 10-P5

head:
  - [10, 1, Conv, [256, 1, 1, None, 1, 1, False]] # 11
  - [-1, 1, AIFI, [1024, 8]] # 12
  - [-1, 1, Conv, [256, 1, 1]] # 13-Y5

  - [-1, 1, DySample, [2, 'lp']] # 14
  - [8, 1, Conv, [256, 1, 1, None, 1, 1, False]] # 15
  - [[-2, -1], 1, Concat, [1]] # 16
  - [-1, 3, RepC3, [256, 0.5]] # 17
  - [-1, 1, Conv, [256, 1, 1]] # 18-Y4

  - [-1, 1, DySample, [2, 'lp']] # 19
  - [6, 1, Conv, [256, 1, 1, None, 1, 1, False]] # 20
  - [[-2, -1], 1, Concat, [1]] # 21
  - [-1, 3, RepC3, [256, 0.5]] # 22-X3

  - [-1, 1, DySample, [2, 'lp']] # 23
  - [4, 1, Conv, [256, 1, 1, None, 1, 1, False]] # 24
  - [[-2, -1], 1, Concat, [1]] # 25
  - [-1, 3, RepC3, [256, 0.5]] # 26-X2

  - [-1, 1, Conv, [256, 3, 2]] # 27
  - [[-1, 22], 1, Concat, [1]] # 28
  - [-1, 3, RepC3, [256, 0.5]] # 29-F3

  - [-1, 1, Conv, [256, 3, 2]] # 30
  - [[-1, 18], 1, Concat, [1]] # 31
  - [-1, 3, RepC3, [256, 0.5]] # 32-F4

  - [-1, 1, Conv, [256, 3, 2]] # 33
  - [[-1, 13], 1, Concat, [1]] # 34
  - [-1, 3, RepC3, [256, 0.5]] # 35-F5

  - [[26, 29, 32, 35], 1, SPAFM, [256, 0]] # 36-P2 fusion
  - [[26, 29, 32, 35], 1, SPAFM, [256, 1]] # 37-P3 fusion
  - [[26, 29, 32, 35], 1, SPAFM, [256, 2]] # 38-P4 fusion
  - [[26, 29, 32, 35], 1, SPAFM, [256, 3]] # 39-P5 fusion

  - [[36, 37, 38, 39], 1, RTDETRDecoder, [nc, 256, 300, 4, 8, 3]]
