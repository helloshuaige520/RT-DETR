# Ultralytics RT-DETR r18 + P3 局部增强
# Only enhance P3 feature in neck (small-object oriented)

nc: 80

scales:
  l: [1.00, 1.00, 1024]

# =========================
# Backbone (r18 原生，不改)
# =========================
backbone:
  - [-1, 1, ConvNormLayer, [32, 3, 2, None, False, 'relu']] # 0-P1/2
  - [-1, 1, ConvNormLayer, [32, 3, 1, None, False, 'relu']] # 1
  - [-1, 1, ConvNormLayer, [64, 3, 1, None, False, 'relu']] # 2
  - [-1, 1, nn.MaxPool2d, [3, 2, 1]]                         # 3-P2/4
  - [-1, 1, Blocks, [64, BasicBlock, 2, 2, 'relu']]          # 4
  - [-1, 1, Blocks, [128, BasicBlock, 2, 3, 'relu']]         # 5-P3
  - [-1, 1, Blocks, [256, BasicBlock, 2, 4, 'relu']]         # 6-P4
  - [-1, 1, Blocks, [512, BasicBlock, 2, 5, 'relu']]         # 7-P5

# =========================
# Neck + Head
# =========================
head:
  - [-1, 1, Conv, [256, 1, 1, None, 1, 1, False]]            # 8 input_proj (P5)
  - [-1, 1, AIFI, [1024, 8]]                                 # 9 Transformer encoder
  - [-1, 1, Conv, [256, 1, 1]]                               # 10 Y5

  # ----- FPN: P5 -> P4 -----
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]               # 11
  - [6, 1, Conv, [256, 1, 1, None, 1, 1, False]]            # 12 P4 proj
  - [[-2, -1], 1, Concat, [1]]                               # 13
  - [-1, 3, RepC3, [256, 0.5]]                               # 14
  - [-1, 1, Conv, [256, 1, 1]]                               # 15 Y4

  # ----- FPN: P4 -> P3 -----
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]               # 16
  - [5, 1, Conv, [256, 1, 1, None, 1, 1, False]]            # 17 P3 proj
  - [[-2, -1], 1, Concat, [1]]                               # 18
  - [-1, 3, RepC3, [256, 0.5]]                               # 19 P3 (fpn)
  - [-1, 1, P3_LocEnhance, [256]]                            # 20 ✅ P3 局部增强

  # ----- PAN: P3 -> P4 -----
  - [-1, 1, Conv, [256, 3, 2]]                               # 21
  - [[-1, 15], 1, Concat, [1]]                               # 22
  - [-1, 3, RepC3, [256, 0.5]]                               # 23 P4 (pan)

  # ----- PAN: P4 -> P5 -----
  - [-1, 1, Conv, [256, 3, 2]]                               # 24
  - [[-1, 10], 1, Concat, [1]]                               # 25
  - [-1, 3, RepC3, [256, 0.5]]                               # 26 P5 (pan)

  # ----- Decoder -----
  - [[19, 23, 26], 1, RTDETRDecoder, [nc, 256, 300, 4, 8, 3]] # 27 Detect
