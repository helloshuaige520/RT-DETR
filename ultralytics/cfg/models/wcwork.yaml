# Ultralytics YOLO 🚀, AGPL-3.0 license
# RT-DETR-l object detection model with P3-P5 outputs. For details see https://docs.ultralytics.com/models/rtdetr

# Parameters
nc: 80  # number of classes
scales: # model compound scaling constants, i.e. 'model=yolov8n-cls.yaml' will call yolov8-cls.yaml with scale 'n'
  # [depth, width, max_channels]
  l: [1.00, 1.00, 1024]

# Backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]  # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]  # 1-P2/4
  - [-1, 1, CSP_PMSFA, [128]]  # 2 [cite: 7]
  - [-1, 1, Conv, [256, 3, 2]]  # 3-P3/8
  - [-1, 1, CSP_PMSFA, [256]]  # 4 [cite: 9]
  - [-1, 1, Conv, [384, 3, 2]]  # 5-P4/16
  - [-1, 1, CSP_PMSFA, [384]]  # 6 [cite: 11]
  - [-1, 1, Conv, [384, 3, 2]]  # 7-P5/32
  - [-1, 3, CSP_PMSFA, [384]]  # 8 [cite: 13]

# Head
head:
  - [-1, 1, Conv, [256, 1, 1, None, 1, 1, False]]  # 9 input_proj.2
  - [-1, 1, AIFI, [1024, 8]] # 10
  - [-1, 1, Conv, [256, 1, 1]]  # 11, Y5, lateral_convs.0
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']] # 12
  - [6, 1, Conv, [256, 1, 1, None, 1, 1, False]]  # 13 input_proj.1
  - [[-2, -1], 1, Concat, [1]] # 14
  - [-1, 3, RepC3, [256, 0.5]]  # 15, fpn_blocks.0
  - [-1, 1, Conv, [256, 1, 1]]   # 16, Y4, lateral_convs.1
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']] # 17
  - [4, 1, Conv, [256, 1, 1, None, 1, 1, False]]  # 18 input_proj.0
  - [[-2, -1], 1, Concat, [1]]  # 19 cat backbone P4
  - [-1, 3, RepC3, [256, 0.5]]    # 20 X3, fpn_blocks.1 (FPN P3输出)

  - [-1, 1, Conv, [256, 3, 2]]   # 21, downsample_convs.0
  - [[-1, 16], 1, Concat, [1]]  # 22 cat Y4
  - [-1, 3, RepC3, [256, 0.5]]    # 23 F4, pan_blocks.0 (FPN P4输出)

  - [-1, 1, Conv, [256, 3, 2]]   # 24, downsample_convs.1
  - [[-1, 11], 1, Concat, [1]]  # 25 cat Y5
  - [-1, 3, RepC3, [256, 0.5]]    # 26 F5, pan_blocks.1 (FPN P5输出)

  # --- 改进修改区域 Start ---
  
  # 原 P3 HAFB 替换为 Concat + RepC3 (更轻量，适合小目标)
  - [[4, 20], 1, Concat, [1]]   # 27 Cat Backbone P3(4) and Neck P3(20)
  - [-1, 3, RepC3, [256, 0.5]]  # 28 New P3 Output (替代了原HAFB的作用)

  # P4 继续使用 HAFB (输入来源不变: 6-Backbone P4, 23-Neck P4)
  - [[6, 23], 1, HAFB, [256, False]] # 29 (P4/16-medium)

  # P5 继续使用 HAFB (输入来源不变: 11-Backbone P5, 26-Neck P5)
  - [[11, 26], 1, HAFB, [256, False]] # 30 (P5/32-large)

  # Detect 头，输入索引更新为 [28, 29, 30]
  - [[28, 29, 30], 1, RTDETRDecoder, [nc, 256, 300, 4, 8, 3]]  # 31 Detect(P3, P4, P5)